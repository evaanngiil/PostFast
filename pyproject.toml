[tool.poetry]
name = "AIPost"
version = "0.3.18"
description = "social-media-suite"
authors = ["Evan <evaanngc@gmail.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
pandas = "^2.3.3"
requests = "^2.34.2"
requests-oauthlib = "^1.3.1"
uvicorn = {extras = ["standard"], version = ">=0.24.0"}
plotly = "^5.24.1"
python-dotenv = "^1.2.3"
pydantic = "^2.13.0"
watchfiles = "^1.2.0"
cryptography = ">=50.0.1"
duckdb = "^1.5.0"
fastapi = ">=0.141.1"
celery = "^5.6.3"
python-multipart = ">=0.0.32"
itsdangerous = "^2.2.0"
supabase = "^2.31.0"
postgrest = "^2.31.0"
langchain = "^1.4.2"
langchain-tavily = "^0.2.18"
langgraph-checkpoint-sqlite = "^3.1.1"
beautifulsoup4 = "^4.15.0"
tavily-python = "^0.7.27"
watchdog = "^6.0.0"
langchain-google-genai = "^4.4.0"
langchain-community = "^0.4.2"
langmem = "^0.0.30"
langgraph-checkpoint = "^4.1.1"
langgraph-checkpoint-redis = "^0.5.2"
langchain-core = "^1.6.3"
langgraph = "^1.2.11"
langgraph-prebuilt = "^1.1.0"
redisvl = ">=0.15.0"
redis = "^7.1.1"
langgraph-checkpoint-postgres = "^3.1.2"
psycopg-binary = "^3.3.6"
pypdf = "^6.19.0"
reportlab = "^4.5.1"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
ruff = ">=0.15"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["backup", "postfast-frontend", "uploaded_pdfs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"